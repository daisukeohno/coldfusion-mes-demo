<table class="hdr" width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td class="hdrTitle">{{ kojoName }}</td>
    <td class="hdrInfo" align="right">Angular + REST API</td>
  </tr>
</table>
<table class="nav" width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td class="navCell" [class.navCur]="view === 'dashboard'">
      <a href="javascript:void(0)" (click)="view = 'dashboard'">ダッシュボード</a>
    </td>
    <td class="navCell" [class.navCur]="view === 'inspection'">
      <a href="javascript:void(0)" (click)="view = 'inspection'">品質検査</a>
    </td>
    <td width="100%">&nbsp;</td>
  </tr>
</table>

<div class="page">
  <app-dashboard *ngIf="view === 'dashboard'"></app-dashboard>
  <app-inspection *ngIf="view === 'inspection'"></app-inspection>
</div>
