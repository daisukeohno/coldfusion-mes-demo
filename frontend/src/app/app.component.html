<table class="hdr" width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td class="hdrTitle">{{ kojoName }}</td>
    <td class="hdrInfo" align="right">Angular + REST API</td>
  </tr>
</table>
<table class="nav" width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td class="navCell" [class.navCur]="screen === 'inspection'">
      <a href="javascript:void(0)" (click)="screen = 'inspection'">品質検査</a>
    </td>
    <td class="navCell" [class.navCur]="screen === 'orders'">
      <a href="javascript:void(0)" (click)="screen = 'orders'">製造指示</a>
    </td>
    <td width="100%">&nbsp;</td>
  </tr>
</table>

<div class="page">
  <app-inspection *ngIf="screen === 'inspection'"></app-inspection>
  <app-orders *ngIf="screen === 'orders'"></app-orders>
</div>
