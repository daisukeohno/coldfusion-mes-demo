<section>
  <h2>■ 不良内容 集計</h2>
  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  }
  <table class="grid">
    <thead><tr><th>不良内容</th><th>件数</th></tr></thead>
    <tbody>
      @for (summary of summaries(); track summary.furyo_naiyo) {
        <tr><td>{{ summary.furyo_naiyo }}</td><td class="num">{{ summary.ken }}</td></tr>
      }
    </tbody>
  </table>
</section>
