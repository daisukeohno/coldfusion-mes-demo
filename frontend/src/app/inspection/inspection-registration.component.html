<section class="box">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-grid">
      <label>製造指示
        <select formControlName="shiji_no">
          <option value="" disabled>選択してください</option>
          <option *ngFor="let order of orders" [value]="order.shiji_no">
            {{ order.shiji_no }} / {{ order.hinmoku_nm }}
          </option>
        </select>
      </label>
      <label>ロット <input type="text" formControlName="lot_no" /></label>
      <label>検査者 <input type="text" formControlName="kensa_sha" /></label>
      <label>測定値 (mm) <input type="text" formControlName="sunpou" /></label>
      <label>規格下限 <input type="text" formControlName="kijun_min" /></label>
      <label>規格上限 <input type="text" formControlName="kijun_max" /></label>
      <label class="wide">不良内容 <input type="text" formControlName="furyo_naiyo" /></label>
      <button class="btn" type="submit" [disabled]="loading">
        {{ loading ? '登録中...' : '判定・登録' }}
      </button>
    </div>
  </form>
  <p class="note">※ 判定は規格範囲で自動決定します。規格上限との差が 0.010mm 未満の場合は「再検査」となります (2011年 暫定運用)。</p>
  <p *ngIf="preview" class="preview">画面上のプレビュー: <strong [class.ng]="preview !== 'OK'">{{ preview }}</strong></p>
  <p *ngIf="result" class="success">登録しました。API確定判定は <strong>{{ result.hantei }}</strong> です。</p>
  <p *ngIf="error" class="error">{{ error }}</p>
</section>
