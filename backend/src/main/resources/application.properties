spring.application.name=mes-backend

# 既存の docker-compose MySQL (mesdb) にそのまま接続する
spring.datasource.url=jdbc:mysql://${MES_DB_HOST:localhost}:${MES_DB_PORT:3306}/mesdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MES_DB_USER:mesuser}
spring.datasource.password=${MES_DB_PASSWORD:mespass}

spring.jackson.property-naming-strategy=SNAKE_CASE
