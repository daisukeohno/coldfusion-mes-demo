server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MES_DB_HOST:localhost}:${MES_DB_PORT:3306}/mesdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
    username: ${MES_DB_USER:mesuser}
    password: ${MES_DB_PASSWORD:mespass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: always
